<style>
:root{--bg:#0A0A0A;--cd:#141414;--cd2:#1b1a14;--tx:#F3EEDD;--mu:#a39a80;--g:#D4AF37;--g2:#f3d77a;--ok:#1B8C4A;--bd:#2c2616;--bad:#e0553f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Poppins,system-ui,sans-serif;background-image:radial-gradient(circle at 50% -10%,#2a2209 0,transparent 55%)}
h1,h2,h3{font-family:'Playfair Display',serif;margin:0 0 8px;font-weight:600}h3{font-size:17px}small{color:var(--mu)}a{color:inherit;text-decoration:none}
.tp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:#0a0a0acc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.br{display:flex;align-items:center;gap:10px}.br img{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--g)}.br b{display:block;font:700 15px Poppins;letter-spacing:.12em}.br small{font-size:10px;letter-spacing:.2em;color:var(--g)}
main{padding:14px;max-width:860px;margin:auto}.cm{padding-bottom:96px}
.c{background:linear-gradient(160deg,var(--cd2),var(--cd));border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;overflow-x:auto}

bdp:async()=>{const l=prompt('Libellé de la dépense'),m=l&&+prompt('Montant (FC)');if(!(m>0))return;await addDoc(collection(db,'bar_dep'),{label:l,montant:m,type:'manual',day:bc().day,t0:Date.now()});await blog('Dépense '+l+' '+F(m))},
bdv:async i=>{const m=prompt("Motif de l'annulation (obligatoire)");if(!m)return;await updateDoc(doc(db,'bar_dep',i),{void:true,motif:m});await blog('Dépense annulée — '+m)},
bma:async()=>{const n=prompt('Matériel'),q=n&&+prompt('Quantité','1');if(!(q>=0)||!n)return;await updateDoc(bref(),{mat:[...(D.bar.mat||[]),{n,q}]})},
bmq:async i=>{const m=D.bar.mat[+i],q=prompt(m.n+' — quantité',m.q);if(q===null||q==='')return;const a=[...D.bar.mat];a[+i]={n:m.n,q:+q};await updateDoc(bref(),{mat:a})},
bpr:async p=>{const[u,k]=p.split('|'),day=bc().day,us=D.us.find(x=>x.id==u),id=day+'_'+u,r=D.bp.find(x=>x.id==id)||{},t=Date.now();if(k=='in')await setDoc(doc(db,'bar_pres',id),{uid:u,name:us.name,day,in:t,st:'present'},{merge:true});else if(k=='out'){if(!r.in)return toast('Aucune arrivée enregistrée');await setDoc(doc(db,'bar_pres',id),{out:t},{merge:true})}else await setDoc(doc(db,'bar_pres',id),{uid:u,name:us.name,day,st:'absent'},{merge:true});await blog('Présence '+us.name+' : '+k)},
bwa:()=>window.open('https://wa.me/'+D_wa()+'?text='+encodeURIComponent(rap(bc()))),
bnd:async()=>{const c=bc();let w='';if(!c.cc)w='⚠ Caisse non comptée. ';else if(Math.abs(c.cc.compte-c.main)>5000)w='⚠ Écart de caisse de '+F(c.cc.compte-c.main)+'. ';const np=c.P.filter(p=>!D.bf.some(f=>f.pid==p.id&&f.day==c.day)).length;if(np)w+='⚠ '+np+' produit(s) sans photo de preuve. ';if(!confirm(w+'Clôturer la journée '+c.day+' ? Le stock restant devient le stock initial et le reste en main est reporté.'))return;
 const snap={};c.P.forEach(p=>snap[p.id]={init:p.init,v:p.v,rev:p.rev??null,cost:p.cost??null});await addDoc(collection(db,'bar_close'),{day:c.day,rep:D.bar.rep||0,main:c.main,prods:snap,cc:c.cc||null,t0:Date.now(),undone:false});
 const u={day:today(),rep:c.main,cc:null};c.P.forEach(p=>{u['prods.'+p.id+'.init']=p.reste;u['prods.'+p.id+'.v']=0;u['prods.'+p.id+'.rev']=0;u['prods.'+p.id+'.cost']=0});await updateDoc(bref(),u);await blog('Journée '+c.day+' clôturée · reste en main '+F(c.main)+' reporté');toast('Nouvelle journée ouverte')},
bun:async()=>{const k=sorted(D.bk.filter(x=>!x.undone),'t0').reverse()[0];if(!k)return toast('Aucune clôture à annuler');if(!confirm('Annuler la clôture du '+k.day+' ?'))return;const u={day:k.day,rep:k.rep,cc:k.cc||null};Object.entries(k.prods).forEach(([id,p])=>{u['prods.'+id+'.init']=p.init;u['prods.'+id+'.v']=p.v;u['prods.'+id+'.rev']=p.rev;u['prods.'+id+'.cost']=p.cost});await updateDoc(bref(),u);await updateDoc(doc(db,'bar_close',k.id),{undone:true});await blog('Clôture du '+k.day+' annulée');toast('Clôture annulée')},
bcc:async()=>{const c=bc(),v=prompt('Caisse comptée (FC) — attendu '+F(c.main),'');if(v===null||v===''||!(+v>=0))return;await updateDoc(bref(),{cc:{day:c.day,compte:+v,by:ME.name,t0:Date.now()}});await blog('Caisse comptée '+F(+v)+' · écart '+F(+v-c.main))},
bph:p=>{const x=BP(p),c=bc(),i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);addDoc(collection(db,'bar_photo'),{pid:p,pn:x.n,day:c.day,img:cv.toDataURL('image/jpeg',.6),by:ME.name,t0:serverTimestamp()}).then(()=>toast('Photo enregistrée : '+x.n)).catch(e=>toast(er(e)))};im.src=rd.result};rd.readAsDataURL(f)};i.click()},
bpdf:async()=>{const c=bc(),bl=rapPdf(c),fn='rapport-ladetente-'+c.day+'.pdf',f=new File([bl],fn,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Rapport La Détente '+c.day});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;a.click();toast('PDF téléchargé')},
bex:()=>{const o={exporte:new Date().toISOString(),bar:D.bar,credits:D.bc,depenses:D.bd,prix:D.bx,renforts:D.br,ventes:D.bv,presence:D.bp,journal:D.bl,clotures:D.bk},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='ladetente-sauvegarde-'+today()+'.json';a.click();toast('Sauvegarde téléchargée')}});

async function reg(own){const e=$('em').value.trim(),p=$('pw').value,n=$('nm').value.trim();if(!n)return toast('Nom requis');const c=await createUserWithEmailAndPassword(au,e,p),u={name:n,email:e,role:own?'admin':'client',pts:0,ph:'',tb:'',tel:'',ref:REF,t0:Date.now()};
 if(own){const b=writeBatch(db);b.set(doc(db,'users',c.user.uid),u);b.set(doc(db,'meta','admin'),{uid:c.user.uid,t0:Date.now()});await b.commit()}else await setDoc(doc(db,'users',c.user.uid),u)}
const keep=()=>{const s=document.querySelector('.md>div'),t=s?s.scrollTop:0;rn();const n=document.querySelector('.md>div');if(n)n.scrollTop=t};
const tmp=()=>{TB=$('tb')?$('tb').value:TB;AD=$('adv')?$('adv').value:AD};
const upd=(c,i,o)=>updateDoc(doc(db,c,i),o);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])Promise.resolve(A[b.dataset.a](b.dataset.p,b)).catch(x=>toast(er(x)))});
document.addEventListener('change',e=>{const s=e.target.closest('[data-c]');if(s&&R=='admin'&&s.dataset.p!=ME.id)upd('users',s.dataset.p,{role:s.value}).then(()=>toast('Rôle modifié')).catch(x=>toast(er(x)))});

l0:()=>{L=0;rn()},l1:()=>{L=1;rn()},am:p=>{AM=p;rn()},hm:()=>{V='home';rn()},pg:p=>{V=p;DR=0;rn()},dr:()=>{DR=DR?0:1;rn()},out:()=>{DR=0;signOut(au)},
go:async()=>{const e=$('em').value.trim(),p=$('pw').value;if(AM=='in')await signInWithEmailAndPassword(au,e,p);else await reg(false)},own:()=>reg(true),
fg:async()=>{const e=$('em').value.trim();if(!e)return toast("Entrez d'abord votre email");await sendPasswordResetEmail(au,e);toast('Email de réinitialisation envoyé')},
mm:()=>{M='menu';Q={};TB='';AD='';rn()},mr:()=>{M='res';rn()},mc:()=>{M=null;rn()},
q:p=>{tmp();const[i,d]=p.split('|');Q[i]=Math.max(0,Math.min(MT(i).s,(Q[i]||0)+ +d));keep()},ct:p=>{tmp();CT=p;keep()},at:p=>{AT=p;rn()},
claim:async()=>{if(!confirm('Devenir administrateur du restaurant ?'))return;const b=writeBatch(db);b.update(doc(db,'users',ME.id),{role:'admin'});b.set(doc(db,'meta','admin'),{uid:ME.id,t0:Date.now()});await b.commit();D.adm=true;toast('Vous êtes maintenant administrateur')},
od:async p=>{tmp();const its=D.menu.filter(m=>Q[m.id]>0).map(m=>({id:m.id,n:m.n,t:m.t,p:m.p,q:Q[m.id]}));if(!its.length)return toast('Choisissez au moins un article');const adv=p=='1';if(adv&&!AD)return toast('Choisissez une heure');
 await addDoc(collection(db,'orders'),{uid:ME.id,cl:ME.name,by:R,srv:R=='client'?'':ME.name,tb:R=='client'?'Client':(TB||'?'),its,tot:its.reduce((a,i)=>a+i.p*i.q,0),t0:serverTimestamp(),adv:adv?AD:'',f:its.some(i=>i.t=='f')?'nouveau':null,d:its.some(i=>i.t=='d')?'nouveau':null,sv:0});
 await Promise.all(its.map(i=>upd('menu',i.id,{s:increment(-i.q),x:increment(i.q)})));M=null;Q={};AD='';TB='';toast('Commande envoyée');rn()},
rs:async()=>{const z=$('rz').value,n=+$('rq').value||1,pl=D.pl.find(x=>x.id==z);if(!pl||pl.max-pl.occ<n)return toast('Pas assez de places');await addDoc(collection(db,'res'),{uid:ME.id,name:ME.name,z,n,h:$('rh').value,t0:Date.now(),done:0});await upd('places',z,{occ:increment(n)});M=null;toast('Réservation confirmée');rn()},
ph:()=>{const f=$('fi').files[0];if(!f)return toast('Choisissez une photo');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(im.width,im.height);c.width=c.height=160;c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,160,160);upd('users',ME.id,{ph:c.toDataURL('image/jpeg',.7)}).then(()=>toast('Photo enregistrée'))};im.src=r.result};r.readAsDataURL(f)},
pn:()=>upd('users',ME.id,{name:$('pn').value.trim()}).then(()=>toast('Nom corrigé')),
pp:async()=>{const v=$('pp').value;if(v.length<6)return toast('6 caractères minimum');await updatePassword(au.currentUser,v);toast('Mot de passe modifié')},
inv:async()=>{const u=location.origin+location.pathname+'?ref='+ME.id,t='Rejoins-moi à La Détente, Kalemie : '+u;if(navigator.share){try{await navigator.share({title:'La Détente',text:t,url:u});return}catch(e){}}window.open('https://wa.me/?text='+encodeURIComponent(t))},
ad:p=>{const[i,k]=p.split('|'),o=D.ord.find(x=>x.id==i);return upd('orders',i,{[k]:o[k]=='nouveau'?'en préparation':'prêt'})},
sr:async i=>{const o=D.ord.find(x=>x.id==i);await upd('orders',i,{sv:1,te:serverTimestamp()});if(o.by=='client')await upd('users',o.uid,{pts:increment(Math.floor(o.tot/1000))})},
nd:async i=>{await addDoc(collection(db,'needs'),{by:ME.name,role:R,m:MT(i).n,t0:Date.now()});toast("Besoin envoyé à l'administrateur")},
rp:async()=>{const t=$('rt').value.trim();if(!t)return;await addDoc(collection(db,'reports'),{uid:ME.id,name:ME.name,role:R,d:new Date().toLocaleDateString('fr'),t,ok:0,t0:Date.now()});$('rt').value='';toast("Rapport envoyé à l'admin")},
vr:i=>upd('reports',i,{ok:1}),dn:i=>deleteDoc(doc(db,'needs',i)),
oc:p=>{const[i,d]=p.split('|'),v=D.pl.find(x=>x.id==i);return upd('places',i,{occ:Math.max(0,Math.min(v.max,v.occ+ +d))})},
mx:i=>{const v=prompt('Capacité de '+i,D.pl.find(x=>x.id==i).max);if(v)return upd('places',i,{max:+v})},
rd:async i=>{const r=D.res.find(x=>x.id==i),v=D.pl.find(x=>x.id==r.z);await upd('res',i,{done:1});if(v)await upd('places',r.z,{occ:Math.max(0,v.occ-r.n)})},
stk:i=>{const v=prompt('Nouveau stock de '+MT(i).n,MT(i).s);if(v)return upd('menu',i,{s:+v})},
dy:i=>upd('menu',i,{d:MT(i).d?0:1}),dm:i=>{if(confirm('Supprimer cet article ?'))return deleteDoc(doc(db,'menu',i))},
am_:()=>{const n=prompt("Nom de l'article");if(!n)return;const t=prompt('Type : f (plat) ou d (boisson)','f')=='d'?'d':'f',p=+prompt('Prix en CDF','10000'),s=+prompt('Stock','20');return setDoc(doc(db,'menu',String(Date.now())),{n,t,p,s,d:0,x:0})},
tb:i=>{const v=prompt('Tables / tâches de cet employé',D.us.find(u=>u.id==i).tb||'');if(v!==null)return upd('users',i,{tb:v})},
tel:i=>{const v=prompt('N° WhatsApp (ex : 243970000000)',D.us.find(u=>u.id==i).tel||'');if(v!==null)return upd('users',i,{tel:v.replace(/\D/g,'')})},
aev:()=>{const t=prompt('Événement (ex : Live Afro-Jazz · VEN 21 JUIN 19h)');if(t)return addDoc(collection(db,'events'),{t,o:Date.now()})},dev:i=>deleteDoc(doc(db,'events',i)),

cfg:p=>{const v=prompt('Nouvelle valeur',D.cfg[p]||'');if(v!==null)return setDoc(doc(db,'cfg','main'),{[p]:p=='wa'?v.replace(/\D/g,''):v.trim()},{merge:true})},

 m.forEach((x,i)=>b.set(doc(db,'menu',String(i+1)),{n:x[0],t:x[1],p:x[2],s:x[3],d:x[4],x:0}));[['Terrasse',20],['Bar',12],['VIP',8]].forEach(x=>b.set(doc(db,'places',x[0]),{max:x[1],occ:0}));
